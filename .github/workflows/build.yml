name: Build skills package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble skills package
        shell: bash
        run: |
          mkdir -p pkg/vc-short-plugin
          cp -r skills agents plugin.json AGENTS.md .claude-plugin .devin-plugin .codebuddy-plugin pkg/vc-short-plugin/
          (cd pkg && zip -qry "../vcshort-skills.zip" vc-short-plugin)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcshort-skills
          path: vcshort-skills.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vcshort-skills.zip
