name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: vcshort-macos
          - os: windows-latest
            artifact: vcshort-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Assemble plugin package
        shell: bash
        run: |
          mkdir -p pkg/vc-short-plugin/bin
          cp -r skills src agents plugin.json AGENTS.md .claude-plugin .devin-plugin .codebuddy-plugin requirements.txt pkg/vc-short-plugin/
          cp bin/vcshort bin/vcshort.bat pkg/vc-short-plugin/bin/
          chmod +x pkg/vc-short-plugin/bin/vcshort

      - name: Test executable (bash launcher)
        shell: bash
        run: |
          pkg/vc-short-plugin/bin/vcshort --help
          pkg/vc-short-plugin/bin/vcshort config-list --help

      - name: Test executable (Windows cmd launcher)
        if: runner.os == 'Windows'
        shell: cmd
        run: vc-short-plugin\bin\vcshort.bat --help
        working-directory: pkg

      - name: Pack zip
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            (cd pkg && zip -qry "../${{ matrix.artifact }}.zip" vc-short-plugin)
          else
            (cd pkg && tar -a -c -f "../${{ matrix.artifact }}.zip" vc-short-plugin)
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
